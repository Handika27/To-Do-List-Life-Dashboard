<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Dashboard</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
    <button id="theme-toggle">🌓 Toggle Dark Mode</button>
    
    <div class="dashboard-container">
        <!-- GREETING SECTION -->
        <div class="card greeting-card">
            <h1 id="current-time">00:00:00</h1>
            <p id="current-date">Day, Month DD, YYYY</p>
            <h2 id="greeting-message">Good Morning, <span id="user-name-display" style="cursor:pointer;" title="Click to change name">Handika</span></h2>
        </div>

        <div class="bottom-grid">
            <!-- FOCUS TIMER SECTION -->
            <div class="card timer-card">
                <h3>Focus Timer</h3>
                <div id="timer-display">25:00</div>
                <div class="input-group" style="justify-content: center; width: 50%; margin: 0 auto 15px auto;">
                <input type="number" id="timer-input" value="25" min="1" max="120" placeholder="Menit">
                <button id="btn-set-timer" class="btn btn-secondary">Set</button>
                </div>
                <div class="timer-controls">
                    <button id="btn-start" class="btn btn-primary">Start</button>
                    <button id="btn-stop" class="btn btn-secondary">Stop</button>
                    <button id="btn-reset" class="btn btn-secondary">Reset</button>
                </div>
            </div>

            <!-- TO-DO LIST SECTION -->
            <div class="card tasks-card">
                <h3>Tasks</h3>
                <div class="input-group">
                    <input type="text" id="task-input" placeholder="Add a new task...">
                    <button id="btn-add-task" class="btn btn-primary">Add</button>
                </div>
                <ul id="task-list"></ul>
            </div>

            <!-- QUICK LINKS SECTION -->
            <div class="card links-card">
                <h3>Quick Links</h3>
                <div class="input-group">
                    <input type="text" id="link-name" placeholder="Link name">
                    <input type="url" id="link-url" placeholder="URL (https://...)">
                    <button id="btn-add-link" class="btn btn-primary">Add Link</button>
                </div>
                <div id="links-container" class="links-container"></div>
            </div>
        </div>
    </div>

    <script src="Js/script.js"></script>
</body>
</html>
